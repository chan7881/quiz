# Supabase 무료 프로젝트는 **1주일 동안 아무 요청이 없으면 자동으로 일시정지**된다.
# 학교에는 방학이 있어서 그냥 두면 개학 첫날 수업 직전에 «앱이 안 열린다»가 된다.
# 그래서 주 3회(월·수·금) 가벼운 요청을 한 번씩 보내 깨워 둔다.
#
# ⚠️ 이 작업이 **실패하면 일부러 잡(job)을 실패시킨다.** GitHub 이 메일을 보내 주므로
#    «조용히 멈춰 있다가 수업 날 발견»하는 최악을 막는 알람 노릇을 한다.
#
# ⚠️ GitHub 은 **저장소에 60일 동안 아무 활동이 없으면 예약 작업을 꺼 버린다.**
#    끄기 전에 메일로 알려 주고, 저장소의 Actions 탭에서 다시 켜면 된다.
#    (커밋을 한 번 하면 60일이 다시 시작된다)
name: Supabase 깨우기

on:
  schedule:
    # 월·수·금 03:17 UTC (한국 시간 12:17). 최대 공백 3일 — 정지 기준 7일에 여유가 넉넉하다.
    # 정각을 피한 이유: 정각은 전 세계 예약 작업이 몰려 밀리거나 건너뛰기 쉽다(GitHub 권고).
    - cron: "17 3 * * 1,3,5"
  workflow_dispatch: {}   # 손으로도 돌려 볼 수 있게

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 주소·키를 config.js 에서 읽는다 — 두 곳에 적어 두면 반드시 어긋난다.
      # 이 값들은 공개돼도 되는 것이라 Secrets 로 감출 필요가 없다(README 3절).
      - name: config.js 에서 주소와 공개 키 읽기
        id: cfg
        run: |
          URL=$(grep -oE 'url:[[:space:]]*"[^"]+"' config.js | sed 's/.*"\(.*\)"/\1/')
          KEY=$(grep -oE 'anonKey:[[:space:]]*"[^"]+"' config.js | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ "${URL#PASTE_}" != "$URL" ]; then
            echo "::error::config.js 에서 url/anonKey 를 읽지 못했습니다."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "주소: $URL"

      # 가장 가벼운 조회 하나(qz_peek). 실제로 테이블을 읽으므로 «활동» 으로 잡힌다.
      # 없는 코드를 넣으므로 아무것도 바꾸지 않는다.
      - name: RPC 한 번 호출해서 깨우기
        run: |
          set -o pipefail
          CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 10 \
            -X POST "${{ steps.cfg.outputs.url }}/rest/v1/rpc/qz_peek" \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"PING00"}') || true
          echo "HTTP $CODE"
          echo "본문: $(cat body.txt)"
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase 가 응답하지 않습니다(HTTP $CODE). 프로젝트가 일시정지됐을 수 있어요 — 대시보드에서 Restore 하세요."
            exit 1
          fi
          if ! grep -q '"found"' body.txt; then
            echo "::error::응답이 예상과 다릅니다. schema.sql 이 그대로 있는지 확인하세요."
            exit 1
          fi
          echo "깨우기 성공 — 프로젝트가 살아 있습니다."
